<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel slide 1, hook</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:#f3efe7}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 48px 48px 0 48px; overflow: hidden; background: #0a1411; color: #f3efe7; font-family: Sora, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 6px">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="PrimeLayer Trades mark" style="width: 64px; height: 64px; flex-shrink: 0">
<g fill="#FF8200" fill-opacity="0.45">
<rect x="17" y="52" width="2" height="42" rx="1"/>
<rect x="13" y="60" width="10" height="26" rx="2"/>
<rect x="34" y="36" width="2" height="48" rx="1"/>
<rect x="30" y="44" width="10" height="30" rx="2"/>
</g>
<rect x="51" y="6" width="2" height="88" rx="1" fill="#FF8200"/>
<rect x="47" y="16" width="10" height="66" rx="2" fill="#FF8200"/>
<path d="M62 16 H74 A16.5 16.5 0 0 1 74 49 H62 V42.5 H74 A10 10 0 0 0 74 22.5 H62 Z" fill="#F3EFE7"/>
</svg>
<div style="font-size: 32px; line-height: 40px; letter-spacing: -0.03em; white-space: nowrap"><span style="font-weight: 400; color: #f3efe7">PrimeLayer</span> <span style="font-weight: 300; color: #93a39b">Trades</span></div>
</div>
<div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 24px; line-height: 32px; font-weight: 500; letter-spacing: 0.14em; color: #93a39b">BTC-USD, 1D, 2026</div>
</div>
<div style="display: flex; gap: 48px; margin-top: 40px">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 184px; line-height: 184px; font-weight: 200; letter-spacing: -0.04em; color: #ff5c7a">-14%</div>
<div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 24px; line-height: 32px; font-weight: 500; letter-spacing: 0.14em; color: #93a39b">THURSDAY, FEB 5</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 184px; line-height: 184px; font-weight: 200; letter-spacing: -0.04em; color: #7ee2a8">+12%</div>
<div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 24px; line-height: 32px; font-weight: 500; letter-spacing: 0.14em; color: #93a39b">FRIDAY, FEB 6</div>
</div>
</div>
<h1 style="margin: 32px 0 0 0; font-size: 88px; line-height: 96px; font-weight: 200; letter-spacing: -0.035em; color: #ff8200">Were you watching?</h1>
<div role="img" aria-label="Daily candles for BTC-USD from January 28 to February 10, 2026. Price falls from about 89,000 dollars to a low of 60,001, with a 14 percent drop on February 5 and a 12 percent rise on February 6." style="display: flex; height: 700px; margin: 0 -48px">
<sc-for list="{{ candles }}" as="k" hint-placeholder-count="14">
<div style="flex: 1 1 0; position: relative; height: 700px">
<div style="position: absolute; left: 50%; margin-left: -2px; width: 4px; top: {{k.wickTop}}px; height: {{k.wickH}}px; border-radius: 2px; background: {{k.color}}; opacity: {{k.strength}}"></div>
<div style="position: absolute; left: 50%; margin-left: -18px; width: 36px; top: {{k.bodyTop}}px; height: {{k.bodyH}}px; border-radius: 6px; background: {{k.color}}; opacity: {{k.strength}}"></div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
renderVals() {
var rows = [
[89116.96, 90476.81, 88706.32, 89162.4],
[89162.4, 89210.16, 83216.21, 84513.2],
[84513.19, 84599, 81000.12, 84110.99],
[84110.99, 84138, 75644.15, 78648],
[78648, 79337.99, 75612.75, 76895.53],
[76895.99, 79339, 74502.21, 78666.85],
[78666.84, 79123.75, 72859, 75661.49],
[75661.49, 76876.54, 71703.72, 72998],
[72999, 73173.96, 62181.65, 62791],
[62788.28, 71707.18, 60001, 70527.7],
[70521.08, 71648.05, 67293.26, 69244.74],
[69250, 72232.17, 68840.83, 70279.33],
[70279.32, 71380.13, 68233.01, 70101.99],
[70101.98, 70489.99, 67857, 68803.65]
];
var top = 90476.81;
var bottom = 60001;
var height = 620;
var offset = 30;
var y = function (price) { return offset + (top - price) / (top - bottom) * height; };
var candles = rows.map(function (r, i) {
var open = r[0], high = r[1], low = r[2], close = r[3];
var up = close >= open;
var bodyTop = y(Math.max(open, close));
var bodyBottom = y(Math.min(open, close));
return {
wickTop: Math.round(y(high)),
wickH: Math.max(4, Math.round(y(low) - y(high))),
bodyTop: Math.round(bodyTop),
bodyH: Math.max(6, Math.round(bodyBottom - bodyTop)),
color: up ? '#7ee2a8' : '#ff5c7a',
strength: (i === 8 || i === 9) ? 1 : 0.3
};
});
return { candles: candles };
}
}
</script>
</body>
</html>
