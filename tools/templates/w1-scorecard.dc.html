<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Friday, strategy scorecard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:#f3efe7}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 48px; background: #0a1411; color: #f3efe7; font-family: Sora, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 6px">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="PrimeLayer Trades mark" style="width: 64px; height: 64px; flex-shrink: 0">
<g fill="#FF8200" fill-opacity="0.45">
<rect x="17" y="52" width="2" height="42" rx="1"/>
<rect x="13" y="60" width="10" height="26" rx="2"/>
<rect x="34" y="36" width="2" height="48" rx="1"/>
<rect x="30" y="44" width="10" height="30" rx="2"/>
</g>
<rect x="51" y="6" width="2" height="88" rx="1" fill="#FF8200"/>
<rect x="47" y="16" width="10" height="66" rx="2" fill="#FF8200"/>
<path d="M62 16 H74 A16.5 16.5 0 0 1 74 49 H62 V42.5 H74 A10 10 0 0 0 74 22.5 H62 Z" fill="#F3EFE7"/>
</svg>
<div style="font-size: 32px; line-height: 40px; letter-spacing: -0.03em; white-space: nowrap"><span style="font-weight: 400; color: #f3efe7">PrimeLayer</span> <span style="font-weight: 300; color: #93a39b">Trades</span></div>
</div>
<div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 24px; line-height: 30px; font-weight: 500; letter-spacing: 0.14em; color: #93a39b">BACKTEST</div>
</div>
<h1 style="margin: 0; font-size: 64px; line-height: 72px; font-weight: 200; letter-spacing: -0.035em">We tested 22 strategies. 10 lost money. Here are all 22.</h1>
<div role="img" aria-label="Total backtest return for each of 22 strategies, ranked from a 38.3 percent gain to a 48.1 percent loss. 12 gained and 10 lost." style="background: #0f1d18; border: 2px solid #1e332b; border-radius: 32px; padding: 28px 40px; display: flex; flex-direction: column">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="22">
<div style="display: flex; align-items: center; gap: 16px; height: 30px">
<div style="width: 480px; flex-shrink: 0; font-size: 24px; line-height: 30px; font-weight: 400; white-space: nowrap">{{r.name}}</div>
<div style="position: relative; width: 260px; height: 30px; flex-shrink: 0">
<div style="position: absolute; left: 144px; top: 0; width: 2px; height: 30px; background: #1e332b"></div>
<div style="position: absolute; left: {{r.left}}px; top: 10px; width: {{r.width}}px; height: 12px; border-radius: 3px; background: {{r.color}}"></div>
</div>
<div style="flex-grow: 1; text-align: right; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 22px; line-height: 30px; font-weight: 500; color: {{r.color}}">{{r.label}}</div>
</div>
</sc-for>
</div>
<div style="font-size: 36px; line-height: 48px; font-weight: 300; letter-spacing: -0.02em; color: #f3efe7">We test everything first, so you choose with data.</div>
<div style="border-top: 2px solid #1e332b; padding-top: 24px; display: flex; align-items: flex-start; gap: 16px; font-size: 28px; line-height: 44px; font-weight: 400; color: #93a39b">
<span aria-hidden="true" style="width: 12px; height: 12px; margin-top: 16px; border-radius: 50%; background: #ff8200; flex-shrink: 0"></span>
<span>Hypothetical backtest. 25 coins, 2022 to 2026, fees included. Not live results.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
renderVals() {
var data = [
['Confirmed Bollinger Breakout', 38.3],
['Bollinger Band Breakout', 38],
['MACD + RSI Momentum Confluence', 27.3],
['EMA + MACD Trend Confluence', 22.6],
['EMA Trend Follow', 19.1],
['Donchian Breakout', 16.3],
['Supertrend Flip', 15.8],
['Chandelier Trend', 13.9],
['GMMA Super Guppy', 12.1],
['MACD Momentum', 10.6],
['Hull MA Trend', 10.2],
['Trend Filtered RSI Reversion', 2.3],
['MACD Trend', -3.9],
['RSI Mean Reversion', -13.6],
['Trend Filtered Williams %R', -14],
['Gaussian Channel', -14.9],
['Stoch RSI Trend Dip', -19.2],
['Trend Filtered Stochastic Reversion', -20.3],
['SMA Golden Cross', -27.5],
['Trend Pullback', -28.6],
['Stochastic Reversal', -48.1],
['Williams %R Dip Buyer', -48.1]
];
var zero = 145;
var scale = 3;
var rows = data.map(function (d) {
var value = d[1];
var size = Math.max(3, Math.round(Math.abs(value) * scale));
return {
name: d[0],
left: value >= 0 ? zero : zero - size,
width: size,
color: value >= 0 ? '#7ee2a8' : '#ff5c7a',
label: (value >= 0 ? '+' : '-') + Math.abs(value).toFixed(1) + '%'
};
});
return { rows: rows };
}
}
</script>
</body>
</html>
